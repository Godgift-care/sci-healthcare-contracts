title: SCI Healthcare
description: Prepaid, purpose-bound care vouchers on Stellar
remote_theme: just-the-docs/just-the-docs

# Rewrites links between .md files to their published URLs. Without this,
# cross-page links written for GitBook would 404 on Pages.
plugins:
  - jekyll-relative-links
  - jekyll-remote-theme

relative_links:
  enabled: true
  collections: false

# SUMMARY.md is GitBook's table of contents; Pages builds its nav from
# front matter instead, so it is excluded rather than rendered as a page.
exclude:
  - SUMMARY.md

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/Godgift-care/sci-healthcare-contracts"

nav_external_links:
  - title: Contracts repo
    url: https://github.com/Godgift-care/sci-healthcare-contracts
  - title: Backend repo
    url: https://github.com/Godgift-care/sci-healthcare-backend
  - title: Frontend repo
    url: https://github.com/Godgift-care/sci-healthcare-frontend
