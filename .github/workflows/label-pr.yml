name: Label pull requests

# Applies the labels in .github/labeler.yml from the files a pull request
# changes: one per contract crate, and one per repository area (scripts, docs,
# .github, examples, deployments).
#
# Runs as pull_request_target so the workflow and label rules always come from
# the default branch: a pull request cannot change how it is labelled. There is
# deliberately no checkout step. actions/labeler only asks the GitHub API for
# the list of changed paths, so no code from the pull request is fetched,
# built or executed.

on:
  pull_request_target:
    # ready_for_review: a draft that becomes reviewable gets labelled even if
    # no new commit arrives. Later commits re-run synchronize.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          # Keep the set accurate when a later commit stops touching an area.
          # Only labels defined in labeler.yml can be removed; labels applied
          # by hand (e.g. security-reviewed) are never touched.
          sync-labels: true
