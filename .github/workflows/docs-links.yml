name: Documentation links

on:
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.mdx'
      - 'docs/**'
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Offline mode makes relative links a deterministic pull-request gate.
      - name: Check relative links
        uses: lycheeverse/lychee-action@1d97d84f0bc547f7b25f4c2170d87d810dc2fb2c # v2.4.0
        with:
          args: --offline --no-progress './README.md' './docs/**/*.md' './docs/**/*.mdx'
          fail: true

      # Network links are retried and remain informational: a transient outage
      # should be visible in the summary without blocking a documentation PR.
      - name: Check external links
        uses: lycheeverse/lychee-action@1d97d84f0bc547f7b25f4c2170d87d810dc2fb2c # v2.4.0
        continue-on-error: true
        with:
          args: --no-progress --verbose --max-retries 3 --retry-wait-time 2 './README.md' './docs/**/*.md' './docs/**/*.mdx'
          fail: false
          jobSummary: true
