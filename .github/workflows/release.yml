name: Release

# Builds the contracts for a tag and attaches them to the GitHub release, so
# integrators and auditors get the exact wasm that was released and a hash
# they can check against the contract that is deployed.
#
# Tagging is the trigger: push a v* tag and the release appears with the
# wasm, a JSON interface spec per contract, SHA256SUMS and the notes below.
#
# The build is the one scripts/build-wasm.sh performs, so the artefacts here
# are the ones scripts/deploy.sh deploys and
# scripts/verify-deployments.sh compares against.
#
# Verifying build provenance
# --------------------------
# Every release is attested with actions/attest-build-provenance.  After the
# release is published, run:
#
#   gh attestation verify sci_voucher.wasm \
#     --owner Godgift-care \
#     --repo sci-healthcare-contracts
#
# to confirm the wasm was built by this workflow and not substituted after the
# fact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach, for example v0.3.0'
        required: true

permissions:
  contents: write
  id-token: write      # OIDC token for build-provenance attestation
  attestations: write  # write the attestation to the repository

env:
  CARGO_TERM_COLOR: always
  # Pinned so the optimised bytes do not change under us. binaryen is the
  # optimiser the Stellar toolchain uses.
  BINARYEN_VERSION: '133'
  # Only used to export the interface specs from the built wasm. Keep it in
  # step with .devcontainer/Dockerfile.
  STELLAR_CLI_VERSION: '27.1.0'

jobs:
  release:
    name: build and attach wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Test before releasing
        run: cargo nextest run --all
      - name: Run doctests
        run: cargo test --doc --all
      - name: Install wasm-opt
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          wasm-opt --version
      - name: Build the contracts
        run: ./scripts/build-wasm.sh dist
      - name: Install the Stellar CLI
        # Only for `stellar contract info interface`: the specs are exported from
        # the wasm just built, so they describe the released bytes.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz stellar
          install -m755 stellar "$HOME/.local/bin/stellar"
          rm -f stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version
      - name: Export the interface specs
        run: ./scripts/export-specs.sh dist
      - name: Show what is being released
        run: |
          ls -lh dist
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.wasm
            dist/*.json
            dist/SHA256SUMS
      - name: Attach the wasm to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The versioned docs site (docs-site.yml) on the default github.io
          # address. Owner names are case-insensitive there and lower-case in
          # the URL.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          DOCS_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          notes="$(mktemp)"
          {
            echo "## Contracts in this release"
            echo
            echo "Built from \`${RELEASE_TAG}\` by \`.github/workflows/release.yml\` with the pinned"
            echo "toolchain (rustc $(rustc --version | cut -d' ' -f2)) and the flags documented in"
            echo "\`docs/developers/contracts.md\`. \`SHA256SUMS\` holds the SHA-256 of every file."
            echo
            echo "## Interfaces in this release"
            echo
            echo "Each contract also ships its interface spec as \`sci_<contract>.json\`,"
            echo "exported from the released wasm with \`stellar contract info interface\`"
            echo "(Stellar CLI ${STELLAR_CLI_VERSION}). Generate client bindings from it without"
            echo "building, and check a deployment against it:"
            echo
            echo '```bash'
            echo "stellar contract info interface --contract-id <CONTRACT_ID> \\"
            echo "  --network testnet --output json > deployed.json"
            echo "diff deployed.json sci_voucher.json"
            echo '```'
            echo
            echo "## Verifying build provenance"
            echo
            echo '```bash'
            echo "gh attestation verify sci_voucher.wasm \\"
            echo "  --owner Godgift-care \\"
            echo "  --repo sci-healthcare-contracts"
            echo '```'
            echo
            echo "## Checking a deployed contract against this release"
            echo
            echo '```bash'
            echo "# The hash of the wasm that is on chain."
            echo "stellar contract info hash --contract-id <CONTRACT_ID> --network testnet"
            echo
            echo "# The hash of the file in this release."
            echo "sha256sum sci_voucher.wasm"
            echo "grep sci_voucher SHA256SUMS"
            echo '```'
            echo
            echo "The two hashes must be identical. \`scripts/verify-deployments.sh\` does the"
            echo "whole comparison for every contract in \`deployments/testnet.env\`."
            echo
            echo "To rebuild the same bytes yourself, run \`./scripts/build-wasm.sh\`."
            echo
            echo "## Documentation for this release"
            echo
            echo "${DOCS_URL}${RELEASE_TAG}/ is the documentation as it stood at \`${RELEASE_TAG}\`."
            echo "The site root, ${DOCS_URL}, documents \`main\` and can describe functions this"
            echo "release does not have. \`.github/workflows/docs-site.yml\` publishes the snapshot"
            echo "when this tag is pushed."
          } > "$notes"
          gh release create "$RELEASE_TAG" dist/*.wasm dist/*.json dist/SHA256SUMS \
            --title "$RELEASE_TAG" \
            --notes-file "$notes" \
            --generate-notes \
            || gh release upload "$RELEASE_TAG" dist/*.wasm dist/*.json dist/SHA256SUMS --clobber
