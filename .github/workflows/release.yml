name: Release

# Builds the contracts for a tag and attaches them to the GitHub release, so
# integrators and auditors get the exact wasm that was released and a hash
# they can check against the contract that is deployed.
#
# Tagging is the trigger: push a v* tag and the release appears with the
# wasm, SHA256SUMS and the notes below.
#
# The build is the one scripts/build-wasm.sh performs, so the artefacts here
# are the ones scripts/deploy.sh deploys and
# scripts/verify-deployments.sh compares against.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach, for example v0.3.0'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned so the optimised bytes do not change under us. binaryen is the
  # optimiser the Stellar toolchain uses.
  BINARYEN_VERSION: '133'

jobs:
  release:
    name: build and attach wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Test before releasing
        run: cargo test --all
      - name: Install wasm-opt
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          wasm-opt --version
      - name: Build the contracts
        run: ./scripts/build-wasm.sh dist
      - name: Show what is being released
        run: |
          ls -lh dist
          cat dist/SHA256SUMS
      - name: Attach the wasm to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="$(mktemp)"
          {
            echo "## Contracts in this release"
            echo
            echo "Built from \`${RELEASE_TAG}\` by \`.github/workflows/release.yml\` with the pinned"
            echo "toolchain (rustc $(rustc --version | cut -d' ' -f2)) and the flags documented in"
            echo "\`docs/developers/contracts.md\`. \`SHA256SUMS\` holds the SHA-256 of every file."
            echo
            echo "## Checking a deployed contract against this release"
            echo
            echo '```bash'
            echo "# The hash of the wasm that is on chain."
            echo "stellar contract info hash --contract-id <CONTRACT_ID> --network testnet"
            echo
            echo "# The hash of the file in this release."
            echo "sha256sum sci_voucher.wasm"
            echo "grep sci_voucher SHA256SUMS"
            echo '```'
            echo
            echo "The two hashes must be identical. \`scripts/verify-deployments.sh\` does the"
            echo "whole comparison for every contract in \`deployments/testnet.env\`."
            echo
            echo "To rebuild the same bytes yourself, run \`./scripts/build-wasm.sh\`."
          } > "$notes"
          gh release create "$RELEASE_TAG" dist/*.wasm dist/SHA256SUMS \
            --title "$RELEASE_TAG" \
            --notes-file "$notes" \
            --generate-notes \
            || gh release upload "$RELEASE_TAG" dist/*.wasm dist/SHA256SUMS --clobber
