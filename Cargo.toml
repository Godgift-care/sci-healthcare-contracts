[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/registry",
    "contracts/receipt",
    "contracts/voucher",
    "contracts/faucet",
    "contracts/sponsor",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Godgift-care/sci-healthcare-contracts"

[workspace.dependencies]
soroban-sdk = "27.0.6"
# The path dependencies carry a version so that `cargo deny` does not read
# them as wildcard requirements (see deny.toml). Keep these in step with
# workspace.package.version when the workspace version is bumped.
sci-common = { path = "contracts/common", version = "0.2.0" }
sci-registry = { path = "contracts/registry", version = "0.2.0" }
sci-receipt = { path = "contracts/receipt", version = "0.2.0" }
sci-voucher = { path = "contracts/voucher", version = "0.2.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
